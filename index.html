
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#fff8ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小氣簿">

<title>小氣簿</title>

<style>
:root{
  --bg:#fff8ef;
  --card:#fff;
  --text:#352b27;
  --muted:#8b7c74;
  --primary:#b96f52;
  --primary-dark:#8f4f39;
  --soft:#f7e8dc;
  --border:#eadbd0;
  --danger:#d95c5c;
  --shadow:0 8px 25px rgba(75,47,35,.08);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,
  "SF Pro Display","PingFang TC","Microsoft JhengHei",sans-serif;
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

.app{
  min-height:100vh;
  padding-bottom:90px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 18px 13px;
  background:rgba(255,248,239,.94);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(234,219,208,.7);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-icon{
  width:44px;
  height:44px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:var(--soft);
  font-size:25px;
  box-shadow:var(--shadow);
}

.brand-title{
  font-size:20px;
  font-weight:800;
}

.brand-sub{
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:14px;
  background:var(--card);
  box-shadow:var(--shadow);
  font-size:19px;
}

main{
  width:min(760px,100%);
  margin:auto;
  padding:18px;
}

.hero{
  padding:22px;
  border-radius:26px;
  background:linear-gradient(135deg,#f9e5d8,#fffaf5);
  box-shadow:var(--shadow);
  margin-bottom:18px;
  border:1px solid #f0ddd0;
}

.hero h1{
  margin:0 0 7px;
  font-size:27px;
}

.hero p{
  margin:0;
  color:var(--muted);
  line-height:1.6;
  font-size:14px;
}

.hero-quote{
  margin-top:15px;
  padding:12px 14px;
  background:rgba(255,255,255,.7);
  border-radius:14px;
  font-size:13px;
  font-weight:700;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:18px;
}

.stat{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  padding:15px 10px;
  text-align:center;
  box-shadow:var(--shadow);
}

.stat-number{
  font-size:25px;
  font-weight:850;
}

.stat-label{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:22px 2px 11px;
}

.section-head h2{
  margin:0;
  font-size:18px;
}

.section-head span{
  color:var(--muted);
  font-size:12px;
}

.search{
  position:relative;
  margin-bottom:13px;
}

.search input{
  width:100%;
  padding:14px 16px 14px 44px;
  border-radius:15px;
  border:1px solid var(--border);
  background:var(--card);
  outline:none;
  color:var(--text);
}

.search-icon{
  position:absolute;
  left:15px;
  top:12px;
  font-size:18px;
}

.friends{
  display:grid;
  gap:11px;
}

.friend-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:19px;
  padding:15px;
  display:flex;
  align-items:center;
  gap:13px;
  box-shadow:var(--shadow);
}

.avatar{
  width:52px;
  height:52px;
  flex:0 0 52px;
  border-radius:17px;
  display:grid;
  place-items:center;
  background:var(--soft);
  font-size:27px;
}

.friend-info{
  min-width:0;
  flex:1;
}

.friend-name{
  font-size:16px;
  font-weight:800;
}

.friend-relation{
  color:var(--primary-dark);
  font-size:11px;
  margin-top:3px;
  font-weight:700;
}

.friend-meta{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
}

.friend-score{
  text-align:right;
}

.score-number{
  font-weight:900;
  font-size:19px;
  color:var(--primary-dark);
}

.score-label{
  font-size:10px;
  color:var(--muted);
}

.empty{
  background:var(--card);
  border:1px dashed var(--border);
  border-radius:20px;
  padding:30px 20px;
  text-align:center;
  color:var(--muted);
}

.empty-icon{
  font-size:42px;
  margin-bottom:8px;
}

.primary-btn{
  width:100%;
  border:0;
  background:var(--primary);
  color:white;
  border-radius:15px;
  padding:14px 18px;
  font-weight:800;
  box-shadow:0 7px 17px rgba(185,111,82,.25);
}

.secondary-btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:14px;
  padding:11px 14px;
  font-weight:700;
}

.danger-btn{
  border:0;
  background:#fbe4e4;
  color:#b64444;
  border-radius:13px;
  padding:10px 13px;
  font-weight:700;
}

.small-btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:11px;
  padding:7px 10px;
  font-size:12px;
}

.bottom-nav{
  position:fixed;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  z-index:30;
  width:min(520px,calc(100% - 24px));
  display:grid;
  grid-template-columns:repeat(3,1fr);
  background:rgba(255,255,255,.94);
  border:1px solid var(--border);
  border-radius:21px;
  box-shadow:0 10px 35px rgba(50,30,20,.16);
  padding:6px;
  backdrop-filter:blur(15px);
}

.nav-btn{
  border:0;
  background:transparent;
  border-radius:16px;
  padding:9px 4px;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}

.nav-btn.active{
  background:var(--soft);
  color:var(--primary-dark);
}

.nav-icon{
  display:block;
  font-size:20px;
  margin-bottom:2px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(25,17,13,.5);
  padding:15px;
  align-items:flex-end;
  justify-content:center;
}

.modal.show{display:flex}

.modal-box{
  width:min(620px,100%);
  max-height:92vh;
  overflow-y:auto;
  background:var(--bg);
  border-radius:27px 27px 18px 18px;
  padding:20px;
  box-shadow:0 -5px 40px rgba(0,0,0,.2);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:17px;
}

.modal-head h2{
  margin:0;
  font-size:21px;
}

.close-btn{
  border:0;
  background:var(--card);
  color:var(--text);
  border-radius:12px;
  width:38px;
  height:38px;
  font-size:19px;
}

.field{margin-bottom:14px}

.field label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin:0 0 7px 3px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:14px;
  padding:13px;
  outline:none;
}

.field textarea{
  min-height:100px;
  resize:vertical;
}

.emoji-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.emoji-option{
  width:45px;
  height:45px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--card);
  font-size:22px;
}

.emoji-option.selected{
  background:var(--soft);
  border-color:var(--primary);
}

.relation-row{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.relation-option{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:14px;
  padding:12px;
  text-align:center;
  font-weight:700;
}

.relation-option.selected{
  background:var(--soft);
  border-color:var(--primary);
  color:var(--primary-dark);
}

.anger-row{
  display:flex;
  gap:7px;
}

.anger-option{
  flex:1;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:13px;
  padding:10px 4px;
  font-size:12px;
}

.anger-option.selected{
  background:var(--soft);
  border-color:var(--primary);
  color:var(--primary-dark);
  font-weight:800;
}

.preview-photo{
  width:100%;
  max-height:220px;
  object-fit:cover;
  border-radius:15px;
  margin-top:8px;
  display:none;
}

.event-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:16px;
  margin-bottom:11px;
  box-shadow:var(--shadow);
}

.event-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.event-person{font-weight:850}

.event-date{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.event-category{
  background:var(--soft);
  color:var(--primary-dark);
  padding:6px 9px;
  border-radius:10px;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}

.event-title{
  font-size:16px;
  font-weight:800;
  margin:13px 0 6px;
}

.event-detail{
  color:#62554e;
  font-size:13px;
  line-height:1.6;
  white-space:pre-wrap;
}

.event-bottom{
  margin-top:13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.stars{letter-spacing:1px}

.event-actions{
  display:flex;
  gap:6px;
}

.event-photo{
  width:100%;
  max-height:230px;
  object-fit:cover;
  border-radius:14px;
  margin-top:12px;
}

.friend-detail-head{
  display:flex;
  align-items:center;
  gap:14px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:17px;
  box-shadow:var(--shadow);
}

.friend-detail-head .avatar{
  width:65px;
  height:65px;
  flex-basis:65px;
  font-size:34px;
}

.detail-name{
  font-size:21px;
  font-weight:900;
}

.detail-relation{
  color:var(--primary-dark);
  font-weight:800;
  font-size:12px;
  margin-top:3px;
}

.detail-stats{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
}

.warning-levels{
  display:grid;
  gap:10px;
}

.warning-level{
  width:100%;
  text-align:left;
  padding:15px;
  border-radius:17px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
}

.warning-level strong{
  display:block;
  margin-bottom:4px;
}

.warning-level span{
  color:var(--muted);
  font-size:12px;
}

.warning-level.yellow{border-left:5px solid #e7c34b}
.warning-level.orange{border-left:5px solid #e89a3d}
.warning-level.red{border-left:5px solid #d95c5c}
.warning-level.black{border-left:5px solid #444}

.warning-level.selected{
  box-shadow:0 0 0 2px var(--primary);
  background:var(--soft);
}

.warning-paper{
  background:#fffdf6;
  color:#29231f;
  padding:24px 20px;
  border:2px solid #e1d7c4;
  box-shadow:0 8px 20px rgba(60,40,20,.1);
  position:relative;
  overflow:hidden;
}

.warning-paper:before{
  content:"";
  position:absolute;
  inset:9px;
  border:1px dashed #c9bda8;
  pointer-events:none;
}

.paper-inner{
  position:relative;
  z-index:1;
}

.paper-school{
  text-align:center;
  font-size:11px;
  letter-spacing:2px;
  color:#766b5e;
}

.paper-title{
  text-align:center;
  font-family:Georgia,"Times New Roman",serif;
  font-size:25px;
  font-weight:900;
  margin:9px 0 3px;
}

.paper-subtitle{
  text-align:center;
  font-size:12px;
  color:#71685e;
  margin-bottom:19px;
}

.paper-section{margin:16px 0}

.paper-section-title{
  font-weight:900;
  font-size:13px;
  margin-bottom:7px;
}

.paper-text{
  font-size:13px;
  line-height:1.75;
}

.paper-warning{
  margin:15px 0;
  padding:11px;
  border:1px solid #d6c7b0;
  background:#faf3e5;
  font-size:12px;
  line-height:1.6;
}

.paper-check{
  margin:5px 0;
  font-size:12px;
}

.paper-sign{
  margin-top:22px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  font-size:11px;
}

.paper-line{
  border-bottom:1px solid #999;
  display:inline-block;
  min-width:85px;
  height:18px;
}

.paper-footer{
  text-align:center;
  margin-top:20px;
  color:#857a6d;
  font-size:10px;
}

.warning-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.settings-list{
  display:grid;
  gap:10px;
}

.settings-item{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.toggle{
  width:48px;
  height:28px;
  border:0;
  border-radius:20px;
  background:#d8ccc5;
  position:relative;
}

.toggle:after{
  content:"";
  position:absolute;
  width:22px;
  height:22px;
  border-radius:50%;
  background:white;
  top:3px;
  left:3px;
  transition:.2s;
}

.toggle.on{background:var(--primary)}

.toggle.on:after{left:23px}

.toast{
  position:fixed;
  left:50%;
  bottom:92px;
  transform:translateX(-50%) translateY(20px);
  background:#332924;
  color:white;
  padding:11px 15px;
  border-radius:13px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:200;
  max-width:calc(100% - 40px);
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

body.dark{
  --bg:#211b18;
  --card:#2c2521;
  --text:#f6eee7;
  --muted:#b8aaa1;
  --primary:#d38a69;
  --primary-dark:#edb093;
  --soft:#49332a;
  --border:#493d36;
  --shadow:0 8px 25px rgba(0,0,0,.2);
}

body.dark .topbar{
  background:rgba(33,27,24,.94);
}

body.dark .hero{
  background:linear-gradient(135deg,#463229,#2b2420);
  border-color:#56453b;
}

body.dark .event-detail{
  color:#d0c4bc;
}

body.dark .bottom-nav{
  background:rgba(44,37,33,.95);
}

@media(min-width:700px){
  .modal{align-items:center}
  .modal-box{border-radius:27px}
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">
  <div class="brand">
    <div class="brand-icon">📕</div>
    <div>
      <div class="brand-title">小氣簿</div>
      <div class="brand-sub">有啲嘢唔係我小氣，我只係有記錄。</div>
    </div>
  </div>

  <button class="icon-btn" id="themeBtn" onclick="toggleDarkMode()">🌙</button>
</header>

<main id="appMain"></main>

<nav class="bottom-nav">

  <button class="nav-btn active" id="navHome" onclick="showPage('home')">
    <span class="nav-icon">🏠</span>
    首頁
  </button>

  <button class="nav-btn" id="navEvents" onclick="showPage('events')">
    <span class="nav-icon">📜</span>
    罪證
  </button>

  <button class="nav-btn" id="navSettings" onclick="showPage('settings')">
    <span class="nav-icon">⚙️</span>
    設定
  </button>

</nav>

</div>

<div class="modal" id="modal">
  <div class="modal-box" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<script>

const STORAGE_KEY="xiaoqi_book_data_v2";
const THEME_KEY="xiaoqi_book_theme";

let data={
  friends:[],
  events:[],
  warnings:[]
};

let currentPage="home";
let selectedFriendId=null;
let editingEventId=null;
let editingFriendId=null;
let editingWarningId=null;

let selectedEmoji="😤";
let selectedAnger=3;
let selectedRelation="朋友";
let selectedWarningLevel="yellow";
let uploadedPhoto="";

const emojiList=[
  "😤","😑","🙄","🤡","🐷","🐸","🐱","🐶",
  "🦊","🐻","🐼","🐵","👻","💩","🤨","😈"
];

const relations=[
  "朋友",
  "好朋友",
  "老best",
  "伴侶"
];

const categories=[
  "放飛機",
  "遲到",
  "已讀不回",
  "借錢唔還",
  "偷食我嘢",
  "講大話",
  "八卦我",
  "激嬲我",
  "突然消失",
  "其他"
];

/* =========================
   初始化
========================= */

loadData();
loadTheme();
render();

/* =========================
   基本工具
========================= */

function uid(prefix="id"){
  return prefix+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
}

function saveData(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}

function loadData(){

  try{

    let saved=localStorage.getItem(STORAGE_KEY);

    /*
      如果使用上一版資料，
      自動嘗試讀取。
    */
    if(!saved){
      const old=localStorage.getItem("xiaoqi_book_data_v1");
      if(old) saved=old;
    }

    if(saved){

      const parsed=JSON.parse(saved);

      data={
        friends:Array.isArray(parsed.friends)?parsed.friends:[],
        events:Array.isArray(parsed.events)?parsed.events:[],
        warnings:Array.isArray(parsed.warnings)?parsed.warnings:[]
      };

      /*
        舊朋友冇 relation 時自動補返
      */
      data.friends.forEach(f=>{
        if(!f.relation) f.relation="朋友";
      });

      /*
        舊警告冇 issuer 時自動補空白
      */
      data.warnings.forEach(w=>{
        if(!w.issuer) w.issuer="";
        if(!w.friendSignature) w.friendSignature="";
        if(!w.comment) w.comment="";
      });
    }

  }catch(e){
    console.error(e);
  }
}

function escapeHTML(str=""){
  return String(str)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function today(){

  const d=new Date();

  return d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0");
}

function formatDate(date){

  if(!date)return "";

  const d=new Date(date+"T00:00:00");

  if(isNaN(d.getTime()))return date;

  return d.toLocaleDateString("zh-HK",{
    year:"numeric",
    month:"long",
    day:"numeric"
  });
}

function getFriend(id){
  return data.friends.find(f=>f.id===id);
}

function getFriendEvents(friendId){

  return data.events
  .filter(e=>e.friendId===friendId)
  .sort((a,b)=>b.date.localeCompare(a.date));
}

function friendScore(friendId){

  return data.events
  .filter(e=>e.friendId===friendId)
  .reduce((sum,e)=>sum+Number(e.anger||0),0);
}

function stars(n){

  n=Number(n||0);

  return "★".repeat(n)+"☆".repeat(5-n);
}

/* =========================
   Toast
========================= */

function showToast(message){

  const el=document.getElementById("toast");

  el.textContent=message;
  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },2200);
}

/* =========================
   Modal
========================= */

function openModal(html){

  document.getElementById("modalBox").innerHTML=html;
  document.getElementById("modal").classList.add("show");
}

function closeModal(){
  document.getElementById("modal").classList.remove("show");
}

document.getElementById("modal").addEventListener("click",function(e){

  if(e.target===this){
    closeModal();
  }

});

/* =========================
   深色模式
========================= */

function loadTheme(){

  if(localStorage.getItem(THEME_KEY)==="dark"){

    document.body.classList.add("dark");

    document.getElementById("themeBtn").textContent="☀️";
  }
}

function toggleDarkMode(){

  document.body.classList.toggle("dark");

  const dark=document.body.classList.contains("dark");

  localStorage.setItem(
    THEME_KEY,
    dark?"dark":"light"
  );

  document.getElementById("themeBtn").textContent=
    dark?"☀️":"🌙";
}

/* =========================
   Page
========================= */

function showPage(page){

  currentPage=page;

  document.querySelectorAll(".nav-btn")
  .forEach(btn=>btn.classList.remove("active"));

  if(page==="home")
    document.getElementById("navHome").classList.add("active");

  if(page==="events")
    document.getElementById("navEvents").classList.add("active");

  if(page==="settings")
    document.getElementById("navSettings").classList.add("active");

  render();
}

function render(){

  const main=document.getElementById("appMain");

  if(currentPage==="home")
    main.innerHTML=renderHome();

  if(currentPage==="events")
    main.innerHTML=renderEventsPage();

  if(currentPage==="settings")
    main.innerHTML=renderSettings();
}

/* =========================
   Home
========================= */

  return `

    <h1>📕 小氣簿</h1>

    <p>
      專門記低啲「唔係我小氣，但係真係要記低」
      嘅事情。
    </p>

    <div class="hero-quote">
      「我唔記仇，我只係有一個非常完整嘅紀錄系統。」🙂
    </div>

  </section>

  <section class="stats">

    <div class="stat">
      <div class="stat-number">${totalFriends}</div>
      <div class="stat-label">朋友</div>
    </div>

    <div class="stat">
      <div class="stat-number">${totalEvents}</div>
      <div class="stat-label">罪證</div>
    </div>

    <div class="stat">
      <div class="stat-number">${totalScore}</div>
      <div class="stat-label">總小氣值</div>
    </div>

  </section>

  <button class="primary-btn" onclick="openFriendForm()">
    ＋ 新增朋友
  </button>

  <div class="section-head">
    <h2>👥 我的朋友</h2>
    <span>${totalFriends} 人</span>
  </div>

  <div class="search">

    <span class="search-icon">🔎</span>

    <input
      placeholder="搜尋朋友..."
      oninput="filterFriends(this.value)"
    >

  </div>

  <div class="friends" id="friendList">

function renderFriendList(friends){

  if(!friends.length){

    return `
      <div class="empty">

        <div class="empty-icon">👀</div>

        <strong>暫時冇朋友上榜</strong>

        <div style="margin-top:6px">
          快啲新增一個，等我哋開始記錄。😈
        </div>

      </div>
    `;
  }

  return friends.map(friend=>{

    const events=getFriendEvents(friend.id);
    const score=friendScore(friend.id);

    return `

      <div
        class="friend-card"
        onclick="openFriendDetail('${friend.id}')"
      >

        <div class="avatar">
          ${escapeHTML(friend.emoji||"😤")}
        </div>

        <div class="friend-info">

          <div class="friend-name">
            ${escapeHTML(friend.name)}
          </div>

          <div class="friend-relation">
            ${escapeHTML(friend.relation||"朋友")}
          </div>

          <div class="friend-meta">
            ${events.length} 宗罪證 · ${score} 小氣值
          </div>

        </div>

        <div class="friend-score">

          <div class="score-number">
            ${score}
          </div>

          <div class="score-label">
            小氣值
          </div>

        </div>

      </div>
    `;

  }).join("");
}

function filterFriends(value){

  const keyword=String(value||"")
    .trim()
    .toLowerCase();

  const filtered=data.friends.filter(friend=>
    (
      friend.name+" "+
      (friend.relation||"")
    ).toLowerCase().includes(keyword)
  );

  document.getElementById("friendList").innerHTML=
    renderFriendList(filtered);
}

/* =========================
   Friend Form
========================= */

function openFriendForm(friendId=null){

  editingFriendId=friendId;

  const friend=friendId?getFriend(friendId):null;

  selectedEmoji=friend?.emoji||"😤";
  selectedRelation=friend?.relation||"朋友";

  openModal(`

    <div class="modal-head">

      <h2>
        ${friend?"✏️ 修改朋友":"👤 新增朋友"}
      </h2>

      <button
        class="close-btn"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>

    <div class="field">

      <label>朋友名稱</label>

      <input
        id="friendName"
        value="${escapeHTML(friend?.name||"")}"
        placeholder="例如：阿明"
      >

    </div>

    <div class="field">

      <label>關係</label>

      <div class="relation-row">

        ${relations.map(r=>`

          <button
            class="relation-option
            ${selectedRelation===r?"selected":""}"
            onclick="selectRelation('${r}',this)"
          >
            ${escapeHTML(r)}
          </button>

        `).join("")}

      </div>

    </div>

    <div class="field">

      <label>代表 Emoji</label>

      <div class="emoji-row">

        ${emojiList.map(emoji=>`

          <button
            class="emoji-option
            ${selectedEmoji===emoji?"selected":""}"
            onclick="selectEmoji('${emoji}',this)"
          >
            ${emoji}
          </button>

        `).join("")}

      </div>

    </div>

    <button
      class="primary-btn"
      onclick="saveFriend()"
    >
      ${friend?"儲存修改":"新增朋友"}
    </button>

    ${
      friend
      ? `

        <div style="height:8px"></div>

        <button
          class="danger-btn"
          style="width:100%"
          onclick="deleteFriend('${friend.id}')"
        >
          🗑️ 刪除朋友及所有紀錄
        </button>
      `
      :""
    }

  `);
}

function selectRelation(relation,element){

  selectedRelation=relation;

  document.querySelectorAll(".relation-option")
    .forEach(btn=>btn.classList.remove("selected"));

  element.classList.add("selected");
}

function selectEmoji(emoji,element){

  selectedEmoji=emoji;

  document.querySelectorAll(".emoji-option")
    .forEach(btn=>btn.classList.remove("selected"));

  element.classList.add("selected");
}

function saveFriend(){

  const name=document
    .getElementById("friendName")
    .value
    .trim();

  if(!name){
    showToast("請先輸入朋友名稱 😗");
    return;
  }

  if(editingFriendId){

    const friend=getFriend(editingFriendId);

    friend.name=name;
    friend.emoji=selectedEmoji;
    friend.relation=selectedRelation;

    showToast("朋友資料已修改 ✏️");

  }else{

    data.friends.push({

      id:uid("friend"),

      name:name,

      emoji:selectedEmoji,

      relation:selectedRelation,

      createdAt:new Date().toISOString()

    });

    showToast("成功新增朋友 👤");
  }

  saveData();
  closeModal();
  render();
}

function deleteFriend(id){

  const friend=getFriend(id);

  if(!friend)return;

  if(!confirm(
    `確定要刪除「${friend.name}」？\n\n所有罪證及警告信都會一齊刪除。`
  ))return;

  data.friends=data.friends.filter(f=>f.id!==id);
  data.events=data.events.filter(e=>e.friendId!==id);
  data.warnings=data.warnings.filter(w=>w.friendId!==id);

  saveData();
  closeModal();
  render();

  showToast("已刪除朋友及相關紀錄");
}

/* =========================
   Event Form
========================= */

function openEventForm(friendId,eventId=null){

  selectedFriendId=friendId;
  editingEventId=eventId;

  const event=eventId
    ?data.events.find(e=>e.id===eventId)
    :null;

  selectedAnger=Number(event?.anger||3);
  uploadedPhoto=event?.photo||"";

  const friend=getFriend(friendId);

  openModal(`

    <div class="modal-head">

      <h2>
        ${event?"✏️ 修改罪證":"😤 記佢一筆"}
      </h2>

      <button
        class="close-btn"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>

    <div style="
      background:var(--soft);
      padding:11px 13px;
      border-radius:13px;
      margin-bottom:15px;
      font-weight:800;
    ">
      ${escapeHTML(friend?.emoji||"😤")}
      ${escapeHTML(friend?.name||"")}
    </div>

    <div class="field">

      <label>日期</label>

      <input
        id="eventDate"
        type="date"
        value="${event?.date||today()}"
      >

    </div>

    <div class="field">

      <label>罪行分類</label>

      <select id="eventCategory">

        ${categories.map(c=>`

          <option
            value="${escapeHTML(c)}"
            ${event?.category===c?"selected":""}
          >
            ${escapeHTML(c)}
          </option>

        `).join("")}

      </select>

    </div>

    <div class="field">

      <label>事情標題</label>

      <input
        id="eventTitle"
        value="${escapeHTML(event?.title||"")}"
        placeholder="例如：又放我飛機"
      >

    </div>

    <div class="field">

      <label>事情詳情</label>

      <textarea
        id="eventDetail"
        placeholder="詳細記低發生咩事……"
      >${escapeHTML(event?.detail||"")}</textarea>

    </div>

    <div class="field">

      <label>激氣程度</label>

      <div class="anger-row">

        ${[1,2,3,4,5].map(n=>`

          <button
            class="anger-option
            ${selectedAnger===n?"selected":""}"
            onclick="selectAnger(${n},this)"
          >
            ${"😤".repeat(n)}
            <br>${n}
          </button>

        `).join("")}

      </div>

    </div>

    <div class="field">

      <label>📸 加相片／罪證 Screenshot</label>

      <input
        id="eventPhoto"
        type="file"
        accept="image/*"
        onchange="handlePhoto(this)"
      >

      ${
        uploadedPhoto
        ?`
          <img
            id="photoPreview"
            class="preview-photo"
            src="${uploadedPhoto}"
            style="display:block"
          >
        `
        :`
          <img
            id="photoPreview"
            class="preview-photo"
          >
        `
      }

    </div>

    <button
      class="primary-btn"
      onclick="saveEvent()"
    >
      ${event?"儲存修改":"記低呢宗罪證"}
    </button>

  `);
}

function selectAnger(n,element){

  selectedAnger=n;

  document.querySelectorAll(".anger-option")
    .forEach(btn=>btn.classList.remove("selected"));

  element.classList.add("selected");
}

function handlePhoto(input){

  const file=input.files?.[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=e=>{

    uploadedPhoto=e.target.result;

    const preview=document.getElementById("photoPreview");

    preview.src=uploadedPhoto;
    preview.style.display="block";
  };

  reader.readAsDataURL(file);
}

function saveEvent(){

  const date=document.getElementById("eventDate").value;
  const category=document.getElementById("eventCategory").value;
  const title=document.getElementById("eventTitle").value.trim();
  const detail=document.getElementById("eventDetail").value.trim();

  if(!date){
    showToast("請選擇日期");
    return;
  }

  if(!title){
    showToast("請輸入事情標題 😤");
    return;
  }

  if(editingEventId){

    const event=data.events.find(e=>e.id===editingEventId);

    event.date=date;
    event.category=category;
    event.title=title;
    event.detail=detail;
    event.anger=selectedAnger;
    event.photo=uploadedPhoto;

    showToast("罪證已更新 ✏️");

  }else{

    data.events.push({

      id:uid("event"),
      friendId:selectedFriendId,
      date,
      category,
      title,
      detail,
      anger:selectedAnger,
      photo:uploadedPhoto,
      createdAt:new Date().toISOString()

    });

    showToast("罪證已成功記錄 📜");
  }

  saveData();
  closeModal();

  if(selectedFriendId)
    openFriendDetail(selectedFriendId);
  else
    render();
}

function renderEventCard(event){

  const friend=getFriend(event.friendId);

  return `

    <div class="event-card">

      <div class="event-top">

        <div>

          <div class="event-person">
            ${escapeHTML(friend?.emoji||"😤")}
            ${escapeHTML(friend?.name||"未知朋友")}
          </div>

          <div class="event-date">
            ${formatDate(event.date)}
          </div>

        </div>

        <span class="event-category">
          ${escapeHTML(event.category)}
        </span>

      </div>

      <div class="event-title">
        ${escapeHTML(event.title)}
      </div>

      ${
        event.detail
        ?`
          <div class="event-detail">
            ${escapeHTML(event.detail)}
          </div>
        `
        :""
      }

      ${
        event.photo
        ?`
          <img
            class="event-photo"
            src="${event.photo}"
          >
        `
        :""
      }

      <div class="event-bottom">

        <div class="stars">
          ${stars(event.anger)}
        </div>

        <div class="event-actions">

          <button
            class="small-btn"
            onclick="openEventForm('${event.friendId}','${event.id}')"
          >
            ✏️
          </button>

          <button
            class="small-btn"
            onclick="deleteEvent('${event.id}')"
          >
            🗑️
          </button>

        </div>

      </div>

    </div>
  `;
}

function deleteEvent(id){

  if(!confirm("確定要刪除呢宗罪證？"))
    return;

  data.events=data.events.filter(e=>e.id!==id);

  saveData();

  if(selectedFriendId)
    openFriendDetail(selectedFriendId);
  else
    render();

  showToast("罪證已刪除");
}

/* =========================
   所有罪證
========================= */

function renderEventsPage(){

  const events=[...data.events]
    .sort((a,b)=>b.date.localeCompare(a.date));

  return `

    <div class="section-head" style="margin-top:5px">
      <h2>📜 所有罪證</h2>
      <span>${events.length} 宗</span>
    </div>

    <div class="search">

      <span class="search-icon">🔎</span>

      <input
        placeholder="搜尋朋友、事件、分類..."
        oninput="filterEvents(this.value)"
      >

    </div>

    <div id="eventList">

      ${
        events.length
        ?events.map(e=>renderEventCard(e)).join("")
        :`
          <div class="empty">

            <div class="empty-icon">😇</div>

            <strong>暫時冇罪證</strong>

            <div style="margin-top:6px">
              大家今日都好乖。應該。
            </div>

          </div>
        `
      }

    </div>
  `;
}

function filterEvents(value){

  const keyword=String(value||"")
    .toLowerCase()
    .trim();

  const events=data.events
    .filter(event=>{

      const friend=getFriend(event.friendId);

      const text=[
        friend?.name||"",
        friend?.relation||"",
        event.title||"",
        event.detail||"",
        event.category||""
      ].join(" ").toLowerCase();

      return text.includes(keyword);

    })
    .sort((a,b)=>b.date.localeCompare(a.date));

  document.getElementById("eventList").innerHTML=

    events.length
    ?events.map(e=>renderEventCard(e)).join("")
    :`
      <div class="empty">
        🔎
        <div style="margin-top:8px">
          搵唔到相關罪證。
        </div>
      </div>
    `;
}

function chooseWarning(level){

  selectedWarningLevel=level;

  document.querySelectorAll(".warning-level")
    .forEach(btn=>btn.classList.remove("selected"));

  const buttons=document.querySelectorAll(".warning-level");

  buttons.forEach(btn=>{

    if(btn.classList.contains(level))
      btn.classList.add("selected");

  });
}

function saveWarning(){

  const date=document
    .getElementById("warningDate")
    .value;

  const issuer=document
    .getElementById("warningIssuer")
    .value.trim();

  const reason=document
    .getElementById("warningReason")
    .value.trim();

  const comment=document
    .getElementById("warningComment")
    .value.trim();

  const friendSignature=document
    .getElementById("friendSignature")
    .value.trim();

  if(!date){
    showToast("請揀警告日期 📅");
    return;
  }

  if(!issuer){
    showToast("請輸入發出警告人姓名 👤");
    return;
  }

  if(!reason){
    showToast("請輸入警告原因");
    return;
  }

  if(editingWarningId){

    const warning=data.warnings
      .find(w=>w.id===editingWarningId);

    if(!warning)return;

    warning.level=selectedWarningLevel;
    warning.date=date;
    warning.issuer=issuer;
    warning.reason=reason;
    warning.comment=comment;
    warning.friendSignature=friendSignature;

    saveData();
    closeModal();

    showWarning(warning);

    showToast("警告信已修改 ✏️");

  }else{

    const warning={
      id:uid("warning"),
      friendId:selectedFriendId,
      level:selectedWarningLevel,
      date,
      issuer,
      reason,
      comment,
      friendSignature,
      createdAt:new Date().toISOString()
    };

    data.warnings.push(warning);

    saveData();
    closeModal();

    showWarning(warning);

    showToast("警告信已生成 🚨");
  }
}

function deleteWarning(id){

  const warning=data.warnings.find(w=>w.id===id);

  if(!warning)return;

  if(!confirm(
    "確定要刪除呢張警告信？\n\n刪除後就會從警告紀錄消失。"
  ))return;

  data.warnings=data.warnings.filter(
    w=>w.id!==id
  );

  saveData();
  closeModal();

  if(selectedFriendId)
    openFriendDetail(selectedFriendId);
  else
    render();

  showToast("警告信已刪除 🗑️");
}

function exportData(){

  const json=JSON.stringify(data,null,2);

  const blob=new Blob(
    [json],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download=
    "小氣簿備份-"+today()+".json";

  a.click();

  URL.revokeObjectURL(url);

  showToast("備份檔案已匯出 💾");
}

/* =========================
   Import
========================= */

function importData(input){

  const file=input.files?.[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=e=>{

    try{

      const imported=JSON.parse(e.target.result);

      if(
        !imported ||
        !Array.isArray(imported.friends) ||
        !Array.isArray(imported.events)
      ){
        throw new Error("invalid");
      }

      data={
        friends:imported.friends,
        events:imported.events,
        warnings:Array.isArray(imported.warnings)
          ?imported.warnings
          :[]
      };

      data.friends.forEach(f=>{
        if(!f.relation)
          f.relation="朋友";
      });

      data.warnings.forEach(w=>{
        if(!w.issuer)w.issuer="";
        if(!w.friendSignature)
          w.friendSignature="";
      });

      saveData();
      render();

      showToast("資料匯入成功 📥");

    }catch(e){

      alert(
        "呢個檔案唔係有效嘅小氣簿備份。"
      );

    }

    input.value="";
  };

  reader.readAsText(file);
}
