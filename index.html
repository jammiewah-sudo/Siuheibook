<script>
/* =========================================================
   小氣簿 Ultimate
   單檔版本
   資料儲存：localStorage
   ========================================================= */

const STORAGE_KEY = "xiaoqi_book_data_v1";
const THEME_KEY = "xiaoqi_book_theme";

let data = {
  friends: [],
  events: [],
  warnings: []
};

let currentPage = "home";
let selectedFriendId = null;
let editingEventId = null;
let editingFriendId = null;
let selectedEmoji = "😤";
let selectedAnger = 3;
let selectedWarningLevel = "yellow";
let uploadedPhoto = "";

const emojiList = [
  "😤","😑","🙄","🤡","🐷","🐸","🐱","🐶",
  "🦊","🐻","🐼","🐵","👻","💩","🤨","😈"
];

const categories = [
  "放飛機",
  "遲到",
  "已讀不回",
  "借錢唔還",
  "偷食我嘢",
  "講大話",
  "八卦我",
  "激嬲我",
  "突然消失",
  "其他"
];

/* ---------- 初始化 ---------- */

loadData();
loadTheme();
render();

/* ---------- 儲存 ---------- */

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);

    if (saved) {
      const parsed = JSON.parse(saved);

      data = {
        friends: Array.isArray(parsed.friends) ? parsed.friends : [],
        events: Array.isArray(parsed.events) ? parsed.events : [],
        warnings: Array.isArray(parsed.warnings) ? parsed.warnings : []
      };
    }
  } catch (e) {
    console.error(e);
  }
}

function uid(prefix = "id") {
  return prefix + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
}

/* ---------- 工具 ---------- */

function escapeHTML(str = "") {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatDate(date) {
  if (!date) return "";

  const d = new Date(date + "T00:00:00");

  if (Number.isNaN(d.getTime())) return date;

  return d.toLocaleDateString("zh-HK", {
    year: "numeric",
    month: "long",
    day: "numeric"
  });
}

function today() {
  const d = new Date();

  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}

function getFriend(id) {
  return data.friends.find(f => f.id === id);
}

function getFriendEvents(friendId) {
  return data.events
    .filter(e => e.friendId === friendId)
    .sort((a,b) => b.date.localeCompare(a.date));
}

function friendScore(friendId) {
  return data.events
    .filter(e => e.friendId === friendId)
    .reduce((sum, e) => sum + Number(e.anger || 0), 0);
}

function stars(n) {
  const x = Number(n || 0);
  return "★".repeat(x) + "☆".repeat(5 - x);
}

/* ---------- Toast ---------- */

function showToast(message) {
  const el = document.getElementById("toast");

  el.textContent = message;
  el.classList.add("show");

  setTimeout(() => {
    el.classList.remove("show");
  }, 2200);
}

/* ---------- Modal ---------- */

function openModal(html) {
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modal").classList.add("show");
}

function closeModal() {
  document.getElementById("modal").classList.remove("show");
}

document.getElementById("modal").addEventListener("click", function(e) {
  if (e.target === this) {
    closeModal();
  }
});

/* ---------- Theme ---------- */

function loadTheme() {
  const theme = localStorage.getItem(THEME_KEY);

  if (theme === "dark") {
    document.body.classList.add("dark");
    document.getElementById("themeBtn").textContent = "☀️";
  }
}

function toggleDarkMode() {
  document.body.classList.toggle("dark");

  const isDark = document.body.classList.contains("dark");

  localStorage.setItem(THEME_KEY, isDark ? "dark" : "light");

  document.getElementById("themeBtn").textContent = isDark ? "☀️" : "🌙";
}

/* ---------- 頁面 ---------- */

function showPage(page) {
  currentPage = page;

  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.classList.remove("active");
  });

  if (page === "home") {
    document.getElementById("navHome").classList.add("active");
  }

  if (page === "events") {
    document.getElementById("navEvents").classList.add("active");
  }

  if (page === "settings") {
    document.getElementById("navSettings").classList.add("active");
  }

  render();
}

function render() {
  const main = document.getElementById("appMain");

  if (currentPage === "home") {
    main.innerHTML = renderHome();
  }

  if (currentPage === "events") {
    main.innerHTML = renderEventsPage();
  }

  if (currentPage === "settings") {
    main.innerHTML = renderSettings();
  }
}

/* ---------- 首頁 ---------- */

function renderHome() {
  const totalEvents = data.events.length;
  const totalFriends = data.friends.length;

  const totalScore = data.events.reduce(
    (sum, e) => sum + Number(e.anger || 0),
    0
  );

  let html = `
    <section class="hero">
      <h1>📕 小氣簿</h1>

      <p>
        專門記低啲「唔係我小氣，但係真係要記低」嘅事情。
      </p>

      <div class="hero-quote">
        「我唔記仇，我只係有一個非常完整嘅紀錄系統。」🙂
      </div>
    </section>

    <section class="stats">
      <div class="stat">
        <div class="stat-number">${totalFriends}</div>
        <div class="stat-label">朋友</div>
      </div>

      <div class="stat">
        <div class="stat-number">${totalEvents}</div>
        <div class="stat-label">罪證</div>
      </div>

      <div class="stat">
        <div class="stat-number">${totalScore}</div>
        <div class="stat-label">總小氣值</div>
      </div>
    </section>

    <button class="primary-btn" onclick="openFriendForm()">
      ＋ 新增朋友
    </button>

    <div class="section-head">
      <h2>👥 我的朋友</h2>
      <span>${totalFriends} 人</span>
    </div>

    <div class="search">
      <span class="search-icon">🔎</span>
      <input
        id="friendSearch"
        placeholder="搜尋朋友..."
        oninput="filterFriends(this.value)"
      >
    </div>

    <div class="friends" id="friendList">
      ${renderFriendList(data.friends)}
    </div>
  `;

  return html;
}

function renderFriendList(friends) {
  if (!friends.length) {
    return `
      <div class="empty">
        <div class="empty-icon">👀</div>
        <strong>暫時冇朋友上榜</strong>
        <div style="margin-top:6px">
          快啲新增一個，等我哋開始記錄。😈
        </div>
      </div>
    `;
  }

  return friends.map(friend => {
    const events = getFriendEvents(friend.id);
    const score = friendScore(friend.id);

    return `
      <div class="friend-card" onclick="openFriendDetail('${friend.id}')">

        <div class="avatar">
          ${escapeHTML(friend.emoji || "😤")}
        </div>

        <div class="friend-info">
          <div class="friend-name">
            ${escapeHTML(friend.name)}
          </div>

          <div class="friend-meta">
            ${events.length} 宗罪證 · ${score} 小氣值
          </div>
        </div>

        <div class="friend-score">
          <div class="score-number">${score}</div>
          <div class="score-label">小氣值</div>
        </div>

      </div>
    `;
  }).join("");
}

function filterFriends(value) {
  const keyword = String(value || "").trim().toLowerCase();

  const filtered = data.friends.filter(friend => {
    return friend.name.toLowerCase().includes(keyword);
  });

  document.getElementById("friendList").innerHTML =
    renderFriendList(filtered);
}

/* ---------- 新增／修改朋友 ---------- */

function openFriendForm(friendId = null) {
  editingFriendId = friendId;

  const friend = friendId ? getFriend(friendId) : null;

  selectedEmoji = friend?.emoji || "😤";

  openModal(`
    <div class="modal-head">
      <h2>${friend ? "✏️ 修改朋友" : "👤 新增朋友"}</h2>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>

    <div class="field">
      <label>朋友名稱</label>
      <input
        id="friendName"
        value="${escapeHTML(friend?.name || "")}"
        placeholder="例如：阿明"
      >
    </div>

    <div class="field">
      <label>選擇代表 Emoji</label>

      <div class="emoji-row">
        ${emojiList.map(emoji => `
          <button
            class="emoji-option ${selectedEmoji === emoji ? "selected" : ""}"
            onclick="selectEmoji('${emoji}', this)"
          >
            ${emoji}
          </button>
        `).join("")}
      </div>
    </div>

    <button class="primary-btn" onclick="saveFriend()">
      ${friend ? "儲存修改" : "新增朋友"}
    </button>

    ${
      friend
      ? `
        <div style="height:8px"></div>

        <button
          class="danger-btn"
          style="width:100%"
          onclick="deleteFriend('${friend.id}')"
        >
          🗑️ 刪除朋友及所有紀錄
        </button>
      `
      : ""
    }
  `);
}

function selectEmoji(emoji, element) {
  selectedEmoji = emoji;

  document.querySelectorAll(".emoji-option").forEach(btn => {
    btn.classList.remove("selected");
  });

  element.classList.add("selected");
}

function saveFriend() {
  const name = document.getElementById("friendName").value.trim();

  if (!name) {
    showToast("請先輸入朋友名稱 😗");
    return;
  }

  if (editingFriendId) {
    const friend = getFriend(editingFriendId);

    friend.name = name;
    friend.emoji = selectedEmoji;

    showToast("朋友資料已修改 ✏️");
  } else {
    data.friends.push({
      id: uid("friend"),
      name,
      emoji: selectedEmoji,
      createdAt: new Date().toISOString()
    });

    showToast("成功新增朋友 👤");
  }

  saveData();
  closeModal();
  render();
}

function deleteFriend(id) {
  const friend = getFriend(id);

  if (!friend) return;

  const ok = confirm(
    `確定要刪除「${friend.name}」？\n\n佢所有罪證亦會一齊刪除。`
  );

  if (!ok) return;

  data.friends = data.friends.filter(f => f.id !== id);
  data.events = data.events.filter(e => e.friendId !== id);
  data.warnings = data.warnings.filter(w => w.friendId !== id);

  saveData();
  closeModal();

  selectedFriendId = null;
  render();

  showToast("已刪除朋友及相關紀錄");
}

/* ---------- 朋友詳情 ---------- */

  const friend = getFriend(id);

  if (!friend) return;

  const events = getFriendEvents(id);
  const score = friendScore(id);

  const warnings = data.warnings

    .sort((a,b) => b.createdAt.localeCompare(a.createdAt));

  openModal(`
    <div class="modal-head">
      <h2>朋友資料</h2>
      <button class="close-btn" onclick="closeModal()">×</button>

      <div class="avatar">
        ${escapeHTML(friend.emoji || "😤")}
      </div>

      <div style="flex:1">

          ${escapeHTML(friend.name)}
        </div>

        <div class="detail-stats">
          <span>📜 ${events.length} 宗罪證</span>
          <span>🚨 ${warnings.length} 次警告</span>
          <span>🔥 ${score} 分</span>
        </div>
      </div>

      <button
        class="small-btn"
        onclick="openFriendForm('${friend.id}')"
      >
        ✏️
      </button>

        </div>
      `
    }

    ${
      warnings.length
      ? `
        <div class="section-head">
          <h2>🚨 警告紀錄</h2>

        ${warnings.map(w => `

/* ---------- 事件 ---------- */

function openEventForm(friendId, eventId = null) {
  selectedFriendId = friendId;
  editingEventId = eventId;

  const event = eventId
    ? data.events.find(e => e.id === eventId)
    : null;

  selectedAnger = Number(event?.anger || 3);
  uploadedPhoto = event?.photo || "";

  const friend = getFriend(friendId);

  openModal(`
    <div class="modal-head">
      <h2>${event ? "✏️ 修改罪證" : "😤 記佢一筆"}</h2>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>

    <div style="
      background:var(--soft);
      padding:11px 13px;
      border-radius:13px;
      margin-bottom:15px;
      font-weight:800;
    ">
      ${escapeHTML(friend?.emoji || "😤")}
      ${escapeHTML(friend?.name || "")}
    </div>

    <div class="field">
      <label>日期</label>
      <input
        id="eventDate"
        type="date"
        value="${event?.date || today()}"
      >
    </div>

    <div class="field">
      <label>罪行分類</label>

      <select id="eventCategory">
        ${categories.map(c => `
          <option
            value="${escapeHTML(c)}"
            ${event?.category === c ? "selected" : ""}
          >
            ${escapeHTML(c)}
          </option>
        `).join("")}
      </select>
    </div>

    <div class="field">
      <label>事情標題</label>

      <input
        id="eventTitle"
        value="${escapeHTML(event?.title || "")}"
        placeholder="例如：又放我飛機"
      >
    </div>

    <div class="field">
      <label>事情詳情</label>

      <textarea
        id="eventDetail"
        placeholder="詳細記低發生咩事……"
      >${escapeHTML(event?.detail || "")}</textarea>
    </div>

    <div class="field">
      <label>激氣程度</label>

      <div class="anger-row">
        ${[1,2,3,4,5].map(n => `
          <button
            class="anger-option ${selectedAnger === n ? "selected" : ""}"
            onclick="selectAnger(${n}, this)"
          >
            ${"😤".repeat(n)}
            <br>
            ${n}
          </button>
        `).join("")}
      </div>
    </div>

    <div class="field">
      <label>📸 加相片／罪證 Screenshot</label>

      <input
        id="eventPhoto"
        type="file"
        accept="image/*"
        onchange="handlePhoto(this)"
      >

      ${
        uploadedPhoto
        ? `
          <img
            id="photoPreview"
            class="preview-photo"
            src="${uploadedPhoto}"
            style="display:block"
          >
        `
        : `
          <img
            id="photoPreview"
            class="preview-photo"
          >
        `
      }
    </div>

    <button class="primary-btn" onclick="saveEvent()">
      ${event ? "儲存修改" : "記低呢宗罪證"}
    </button>
  `);
}

function selectAnger(n, element) {
  selectedAnger = n;

  document.querySelectorAll(".anger-option").forEach(btn => {
    btn.classList.remove("selected");
  });

  element.classList.add("selected");
}

function handlePhoto(input) {
  const file = input.files?.[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {
    uploadedPhoto = e.target.result;

    const preview = document.getElementById("photoPreview");

    preview.src = uploadedPhoto;
    preview.style.display = "block";
  };

  reader.readAsDataURL(file);
}

function saveEvent() {
  const date = document.getElementById("eventDate").value;
  const category = document.getElementById("eventCategory").value;
  const title = document.getElementById("eventTitle").value.trim();
  const detail = document.getElementById("eventDetail").value.trim();

  if (!date) {
    showToast("請選擇日期");
    return;
  }

  if (!title) {
    showToast("請輸入事情標題 😤");
    return;
  }

  if (editingEventId) {
    const event = data.events.find(e => e.id === editingEventId);

    if (!event) return;

    event.date = date;
    event.category = category;
    event.title = title;
    event.detail = detail;
    event.anger = selectedAnger;
    event.photo = uploadedPhoto;

    showToast("罪證已更新 ✏️");
  } else {
    data.events.push({
      id: uid("event"),
      friendId: selectedFriendId,
      date,
      category,
      title,
      detail,
      anger: selectedAnger,
      photo: uploadedPhoto,
      createdAt: new Date().toISOString()
    });

    showToast("罪證已成功記錄 📜");
  }

  saveData();
  closeModal();

  if (selectedFriendId) {
    openFriendDetail(selectedFriendId);
  } else {
    render();
  }
}

function renderEventCard(event) {
  const friend = getFriend(event.friendId);

  return `
    <div class="event-card">

      <div class="event-top">

        <div>
          <div class="event-person">
            ${escapeHTML(friend?.emoji || "😤")}
            ${escapeHTML(friend?.name || "未知朋友")}
          </div>

          <div class="event-date">
            ${formatDate(event.date)}
          </div>
        </div>

        <span class="event-category">
          ${escapeHTML(event.category)}
        </span>

      </div>

      <div class="event-title">
        ${escapeHTML(event.title)}
      </div>

      ${
        event.detail
        ? `
          <div class="event-detail">
            ${escapeHTML(event.detail)}
          </div>
        `
        : ""
      }

      ${
        event.photo
        ? `
          <img
            class="event-photo"
            src="${event.photo}"
            alt="罪證相片"
          >
        `
        : ""
      }

      <div class="event-bottom">

        <div class="stars">
          ${stars(event.anger)}
        </div>

        <div class="event-actions">

          <button
            class="small-btn"
            onclick="openEventForm('${event.friendId}','${event.id}')"
          >
            ✏️
          </button>

          <button
            class="small-btn"
            onclick="deleteEvent('${event.id}')"
          >
            🗑️
          </button>

        </div>
      </div>

    </div>
  `;
}

function deleteEvent(id) {
  const event = data.events.find(e => e.id === id);

  if (!event) return;

  if (!confirm("確定要刪除呢宗罪證？")) return;

  data.events = data.events.filter(e => e.id !== id);

  saveData();

  if (selectedFriendId) {
    openFriendDetail(selectedFriendId);
  } else {
    render();
  }

  showToast("罪證已刪除");
}

/* ---------- 所有罪證頁 ---------- */

function renderEventsPage() {
  const events = [...data.events].sort(
    (a,b) => b.date.localeCompare(a.date)
  );

  return `
    <div class="section-head" style="margin-top:5px">
      <h2>📜 所有罪證</h2>
      <span>${events.length} 宗</span>
    </div>

    <div class="search">
      <span class="search-icon">🔎</span>

      <input
        id="eventSearch"
        placeholder="搜尋朋友、事件、分類..."
        oninput="filterEvents(this.value)"
      >
    </div>

    <div id="eventList">
      ${
        events.length
        ? events.map(e => renderEventCard(e)).join("")
        : `
          <div class="empty">
            <div class="empty-icon">😇</div>
            <strong>暫時冇罪證</strong>
            <div style="margin-top:6px">
              大家今日都好乖。應該。
            </div>
          </div>
        `
      }
    </div>
  `;
}

function filterEvents(value) {
  const keyword = String(value || "").toLowerCase().trim();

  const events = data.events
    .filter(event => {
      const friend = getFriend(event.friendId);

      const text = [
        friend?.name || "",
        event.title || "",
        event.detail || "",
        event.category || ""
      ].join(" ").toLowerCase();

      return text.includes(keyword);
    })
    .sort((a,b) => b.date.localeCompare(a.date));

  document.getElementById("eventList").innerHTML =
    events.length
      ? events.map(e => renderEventCard(e)).join("")
      : `
        <div class="empty">
          🔎
          <div style="margin-top:8px">
            搵唔到相關罪證。
          </div>
        </div>
      `;
}

/* ---------- 警告信 ---------- */

function openWarningForm(friendId) {
  selectedFriendId = friendId;
  selectedWarningLevel = "yellow";

  const friend = getFriend(friendId);
  const events = getFriendEvents(friendId);

  const recent = events[0];

  openModal(`
    <div class="modal-head">
      <h2>🚨 發出警告信</h2>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>

    <div style="
      background:var(--soft);
      padding:12px;
      border-radius:14px;
      margin-bottom:15px;
      font-weight:800;
    ">
      ${escapeHTML(friend?.emoji || "😤")}
      ${escapeHTML(friend?.name || "")}
    </div>

    <div class="field">
      <label>警告級別</label>

      <div class="warning-levels">

        <button
          class="warning-level yellow"
          onclick="chooseWarning('yellow')"
        >
          <strong>🟡 口頭警告</strong>
          <span>「今次先提你，下次唔好再犯。」</span>
        </button>

        <button
          class="warning-level orange"
          onclick="chooseWarning('orange')"
        >
          <strong>🟠 書面警告</strong>
          <span>正式記錄，已經唔可以當冇事。</span>
        </button>

        <button
          class="warning-level red"
          onclick="chooseWarning('red')"
        >
          <strong>🔴 嚴重警告</strong>
          <span>情況嚴重，需要立即改善行為。</span>
        </button>

        <button
          class="warning-level black"
          onclick="chooseWarning('black')"
        >
          <strong>💀 最後通牒</strong>
          <span>再犯就……自己諗後果啦。</span>
        </button>

      </div>
    </div>

    <div class="field">
      <label>事件日期</label>
      <input
        id="warningDate"
        type="date"
        value="${recent?.date || today()}"
      >
    </div>

    <div class="field">
      <label>警告原因</label>
      <input
        id="warningReason"
        value="${escapeHTML(recent?.title || "")}"
        placeholder="例如：又放我飛機"
      >
    </div>

    <div class="field">
      <label>老師評語</label>
      <textarea
        id="warningComment"
        placeholder="寫低你想對佢講嘅嘢……"
      >希望下次可以改善，唔好再令老師失望。🙂</textarea>
    </div>

    <button class="primary-btn" onclick="createWarning()">
      📝 生成警告回條
    </button>
  `);
}

function chooseWarning(level) {
  selectedWarningLevel = level;

  showToast(
    "已選擇：" + warningTitle(level)
  );
}

function warningTitle(level) {
  const map = {
    yellow: "口頭警告",
    orange: "書面警告",
    red: "嚴重警告",
    black: "最後通牒"
  };

  return map[level] || "警告";
}

function warningEmoji(level) {
  const map = {
    yellow: "🟡",
    orange: "🟠",
    red: "🔴",
    black: "💀"
  };

  return map[level] || "⚠️";
}

function createWarning() {
  const friend = getFriend(selectedFriendId);

  if (!friend) return;

  const date = document.getElementById("warningDate").value;
  const reason = document.getElementById("warningReason").value.trim();
  const comment = document.getElementById("warningComment").value.trim();

  if (!reason) {
    showToast("請輸入警告原因");
    return;
  }

  const warning = {
    id: uid("warning"),
    friendId: selectedFriendId,
    level: selectedWarningLevel,
    date,
    reason,
    comment,
    createdAt: new Date().toISOString()
  };

  data.warnings.push(warning);

  saveData();
  closeModal();

  showWarning(warning);

  showToast("警告信已生成 🚨");
}

function showWarning(warning) {
  const friend = getFriend(warning.friendId);

  openModal(`
    <div class="modal-head">
      <h2>🚨 警告回條</h2>

      <button class="close-btn" onclick="closeModal()">
        ×

/* ---------- 分享警告信 ---------- */

async function shareWarning() {
  const text =
    "🚨 小氣簿警告信\n\n" +
    "呢位朋友已經收到正式警告。\n" +
    "原因：「我只係記性比較好。」🙂";

  if (navigator.share) {
    try {
      await navigator.share({
        title: "小氣簿警告信",
        text
      });

      return;
    } catch (e) {}
  }

  try {
    await navigator.clipboard.writeText(text);

    showToast("警告信內容已複製，可以貼去 WhatsApp 📋");
  } catch (e) {
    showToast("手機未能直接分享，請使用截圖。");
  }
}

/* ---------- 匯出／匯入 ---------- */

function exportData() {
  const json = JSON.stringify(data, null, 2);

  const blob = new Blob(
    [json],
    { type: "application/json" }
  );

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");

  a.href = url;
  a.download =
    "小氣簿備份-" +
    today() +
    ".json";

  a.click();

  URL.revokeObjectURL(url);

  showToast("備份檔案已匯出 💾");
}

function importData(input) {
  const file = input.files?.[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);

      if (
        !imported ||
        !Array.isArray(imported.friends) ||
        !Array.isArray(imported.events)
      ) {
        throw new Error("格式不正確");
      }

      data = {
        friends: imported.friends,
        events: imported.events,
        warnings: Array.isArray(imported.warnings)
          ? imported.warnings
          : []
      };

      saveData();
      render();

      showToast("資料匯入成功 📥");

    } catch (error) {
      alert("呢個檔案唔係有效嘅小氣簿備份。");
    }

    input.value = "";
  };

  reader.readAsText(file);
}

function clearAllData() {
  const first = confirm(
    "⚠️ 確定要清除全部資料？"
  );

  if (!first) return;

  const second = confirm(
    "真係確定？所有朋友、罪證、警告信都會永久刪除。"
  );

  if (!second) return;

  data = {
    friends: [],
    events: [],
    warnings: []
  };

  saveData();
  render();

  showToast("所有資料已清除");
}
